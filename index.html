<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>RK_JARVIS</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#060c1a;color:#c8d8f0;font-family:system-ui,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0c1833;border-bottom:1px solid #1b335c}header h1{font-size:16px;color:#4ea8ff;letter-spacing:1px}.dot{width:9px;height:9px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 8px #ff3b3b}.dot.on{background:#00ff88;box-shadow:0 0 8px #00ff88}.chips{display:flex;gap:8px;padding:8px 10px;flex-wrap:wrap;background:#0a142a}.chip{background:#112240;border:1px solid #1e3a5f;border-radius:999px;padding:5px 12px;font-size:11px;color:#7fb8ff}#videoWrap{position:relative;height:38vh;background:#000;overflow:hidden}#videoWrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#ov{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:11px;color:#7fb8ff}#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#070e20}.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.35}.msg.jarvis{align-self:flex-start;background:#13264a;border:1px solid #25406e}.msg.user{align-self:flex-end;background:#1d5cb3;color:#fff;border-radius:16px 16px 4px 16px}.ctrl{display:flex;gap:6px;padding:8px 10px;background:#0c1833;flex-wrap:wrap}.cbtn{background:#112240;border:1px solid #21406c;color:#8ab4ff;border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer}.bar{display:flex;gap:8px;padding:10px;background:#0c1833;border-top:1px solid #1b335c;align-items:center}.bar input{flex:1;background:#112240;border:1px solid #22426e;border-radius:24px;padding:12px 16px;color:#fff;outline:none}.bar button{width:44px;height:44px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer}#micBtn{background:#112240;border:1px solid #22426e}#sendBtn{background:#1e5cb8;color:#fff;font-size:18px}</style></head><body><header><h1>RK_JARVIS SYSTEM</h1><div style="display:flex;align-items:center;gap:8px"><div class="dot" id="dot"></div><span id="stxt" style="font-size:12px">Opérationnel</span></div></header><div class="chips"><div class="chip" id="batt">--%</div><div class="chip" id="gps">GPS --</div><div class="chip" id="meteo">Système nominal</div></div><div id="videoWrap"><video id="video" autoplay playsinline muted></video><div id="ov"><span>VISION ACTIVE - Dites JARVIS</span></div></div><div id="chat"></div><div class="ctrl"><button class="cbtn" onclick="getLocation()">📍 Localiser</button><button class="cbtn" onclick="toggleTorch()">💡 Torche</button><button class="cbtn" onclick="clearAll()">🧠 Reset</button></div><div class="bar"><input id="inp" placeholder="Parlez à JARVIS..."><button id="micBtn">🎤</button><button id="sendBtn">➤</button></div><script>
const chat=document.getElementById('chat'),inp=document.getElementById('inp'),video=document.getElementById('video'),dot=document.getElementById('dot'),stxt=document.getElementById('stxt'),micBtn=document.getElementById('micBtn');
let track=null,torchOn=false,recog,wakeRecog;let voix=null;const synth=window.speechSynthesis;
function loadV(){const vs=synth.getVoices();voix=vs.find(v=>v.lang.includes('fr'))||vs[0];}synth.onvoiceschanged=loadV;loadV();
function addMsg(t,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;localStorage.setItem('j_hist',chat.innerHTML.slice(-8000));}
function speak(t){try{synth.cancel();let u=new SpeechSynthesisUtterance(t);u.voice=voix;u.lang='fr-FR';u.rate=0.82;u.pitch=0.58;u.volume=0.95;synth.speak(u);}catch{}}
async function initCam(){try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});video.srcObject=s;track=s.getVideoTracks()[0];dot.classList.add('on');}catch{stxt.textContent='Caméra non autorisée';}}
function getLocation(){addMsg('Triangulation en cours, Monsieur...','jarvis');if(!navigator.geolocation){addMsg('GPS indisponible, Monsieur.','jarvis');return;}navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude.toFixed(4),lo=p.coords.longitude.toFixed(4);document.getElementById('gps').textContent=la+','+lo;addMsg('Position verrouillée: '+la+', '+lo+'. Secteur Goma nominal, Monsieur.','jarvis');speak('Position verrouillée.');},()=>addMsg('Signal GPS faible, Monsieur.','jarvis'));}
async function toggleTorch(){if(!track){addMsg('Module torche indisponible, Monsieur.','jarvis');return;}try{const c=track.getCapabilities();if(!c.torch){addMsg('Torche non supportée sur cet appareil, Monsieur.','jarvis');return;}torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]});addMsg(torchOn?'Torche activée, Monsieur.':'Torche désactivée, Monsieur.','jarvis');}catch{addMsg('Erreur torche, Monsieur.','jarvis');}}
function clearAll(){localStorage.removeItem('j_hist');chat.innerHTML='';addMsg('Mémoire effacée. Système réinitialisé, Monsieur.','jarvis');}
function updateBatt(){if(navigator.getBattery){navigator.getBattery().then(b=>{document.getElementById('batt').textContent=Math.round(b.level*100)+'%';});}}
function jarvisReply(prompt){const l=prompt.toLowerCase();if(l.includes('bonjour')||l.includes('salut'))return 'Bonjour Monsieur. Systèmes opérationnels. Comment puis-je vous assister ?';if(l.includes('ca va')||l.includes('ça va'))return 'Tous les systèmes sont nominaux, Monsieur. À votre service.';if(l.includes('heure'))return 'Il est '+new Date().toLocaleTimeString('fr-FR')+', Monsieur.';if(l.includes('torche')||l.includes('lampe')){toggleTorch();return 'Exécution immédiate, Monsieur.';}if(l.includes('localise')||l.includes('position')||l.includes('gps')){getLocation();return 'Localisation en cours, Monsieur.';}if(l.includes('qui es tu'))return 'Je suis RK JARVIS, votre intelligence opérationnelle personnelle, Monsieur. Version sérieuse et discrète.';if(l.includes('merci'))return 'À votre service, Monsieur.';return 'Bien reçu, Monsieur. "'+prompt+'" enregistré. Analyse en cours. Système à l\'écoute.';}
async function send(){const t=inp.value.trim();if(!t)return;addMsg(t,'user');inp.value='';const r=jarvisReply(t);setTimeout(()=>{addMsg(r,'jarvis');speak(r);},320);}
document.getElementById('sendBtn').onclick=send;inp.onkeydown=e=>{if(e.key==='Enter')send();};
micBtn.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addMsg('Reconnaissance vocale non supportée, Monsieur.','jarvis');return;}try{wakeRecog&&wakeRecog.stop();}catch{}recog=new SR();recog.lang='fr-FR';recog.onstart=()=>{micBtn.textContent='🔴';stxt.textContent='Écoute...';};recog.onend=()=>{micBtn.textContent='🎤';stxt.textContent='Opérationnel';};recog.onresult=e=>{inp.value=e.results[0][0].transcript;send();};recog.start();};
initCam();updateBatt();let h=localStorage.getItem('j_hist');if(h)chat.innerHTML=h;addMsg('Monsieur. Systèmes en ligne. Vision, énergie et sécurité opérationnelles. Prêt à exécuter.','jarvis');
</script></body></html>
