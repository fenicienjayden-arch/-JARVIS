<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RK_JARVIS</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0f1e;color:#d0d8e8;font-family:system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0f1a33;border-bottom:1px solid #1e3a5f}h1{margin:0;font-size:16px;color:#4ea8ff;letter-spacing:1px}.status{display:flex;align-items:center;gap:6px;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#555}.dot.on{background:#00ff88;box-shadow:0 0 8px #00ff88}.info{display:flex;gap:8px;padding:8px 10px;flex-wrap:wrap}.chip{background:#112240;border:1px solid #1e3a5f;border-radius:20px;padding:6px 12px;font-size:12px}#videoWrap{position:relative;flex:0 0 38vh;background:#000;overflow:hidden;border-top:1px solid #1e3a5f;border-bottom:1px solid #1e3a5f}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#overlay{position:absolute;bottom:0;left:0;right:0;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:11px;color:#7fb8ff;letter-spacing:.5px}#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.35}.msg.jarvis{background:#162a4a;border:1px solid #22426e;align-self:flex-start;border-bottom-left-radius:4px}.msg.user{background:#1e4a8a;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}.msg.proactive{border-left:3px solid #00ff88}.controls{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:#0f1a33;border-top:1px solid #1e3a5f}.cbtn{background:#112240;border:1px solid #22426e;color:#8ab4ff;border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer}.inputBar{display:flex;gap:8px;padding:10px;background:#0a0f1e;border-top:1px solid #1e3a5f}input{flex:1;background:#112240;border:1px solid #22426e;border-radius:24px;padding:12px 16px;color:#fff;outline:none}#micBtn,#sendBtn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;font-size:18px}#micBtn{background:#112240;border:1px solid #22426e}#micBtn.listening{background:#ff3040}#sendBtn{background:#1e5cb8;color:#fff}</style></head><body><header><h1>RK_JARVIS</h1><div class="status"><div class="dot" id="dot"></div><span id="stxt">Initialisation</span></div></header><div class="info"><div class="chip" id="batt">--%</div><div class="chip" id="gps">GPS --</div><div class="chip" id="meteo">--</div><div class="chip" id="mood">Système nominal</div></div><div id="videoWrap"><video id="video" autoplay playsinline muted></video><canvas id="canvas" style="display:none"></canvas><div id="overlay"><span id="overlayTxt">VISION ACTIVE - Dites JARVIS</span></div></div><div id="chat"></div><div class="controls"><button class="cbtn" onclick="getLocation()">📍 Localiser</button><button class="cbtn" onclick="toggleTorch()">💡 Torche</button><button class="cbtn" onclick="connectBT()">🔵 BT</button><button class="cbtn" onclick="takePhoto()">👁️ Analyser</button><button class="cbtn" onclick="exportChat()">💾 Sauver</button><button class="cbtn" onclick="clearMemory()">🧠 Reset</button></div><div class="inputBar"><input id="inp" placeholder="Parlez à JARVIS..."><button id="micBtn">🎤</button><button id="sendBtn">➤</button></div><script>const chat=document.getElementById('chat'),inp=document.getElementById('inp'),video=document.getElementById('video'),canvas=document.getElementById('canvas'),dot=document.getElementById('dot'),stxt=document.getElementById('stxt'),micBtn=document.getElementById('micBtn'),overlayTxt=document.getElementById('overlayTxt');let recog,wakeRecog,voix,apiKey='',track=null,torchOn=false;const synth=window.speechSynthesis;function loadVoix(){const vs=synth.getVoices();voix=vs.find(v=>v.name.includes('Google')&&v.lang.includes('fr'))||vs.find(v=>v.lang.includes('fr'))||vs[0];}synth.onvoiceschanged=loadVoix;loadVoix();function addMsg(t,c,pro=false){const d=document.createElement('div');d.className='msg '+c+(pro?' proactive':'');d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;try{localStorage.setItem('jarvis_hist',chat.innerHTML.slice(-9000));}catch{}}function speak(t){try{synth.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=voix;u.lang='fr-FR';u.rate=0.82
const chat=document.getElementById('chat'),inp=document.getElementById('inp'),video=document.getElementById('video'),canvas=document.getElementById('canvas'),dot=document.getElementById('dot'),stxt=document.getElementById('stxt'),micBtn=document.getElementById('micBtn'),overlayTxt=document.getElementById('overlayTxt');let recog,wakeRecog,voix,apiKey='',track=null,torchOn=false;const synth=window.speechSynthesis;function loadVoix(){const vs=synth.getVoices();voix=vs.find(v=>v.name.includes('Google')&&v.lang.includes('fr'))||vs.find(v=>v.lang.includes('fr'))||vs[0];}synth.onvoiceschanged=loadVoix;loadVoix();function addMsg(t,c,pro=false){const d=document.createElement('div');d.className='msg '+c+(pro?' proactive':'');d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;try{localStorage.setItem('jarvis_hist',chat.innerHTML.slice(-9000));}catch{}}function speak(t){try{synth.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=voix;u.lang='fr-FR';u.rate=0.82;u.pitch=0.62;u.volume=0.95;synth.speak(u);}catch{}}
async function initCam(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});video.srcObject=s;track=s.getVideoTracks()[0];dot.classList.add('on');stxt.textContent='Opérationnel';}catch{dot.classList.add('on');stxt.textContent='Opérationnel';}}
async function getLocation(){addMsg("Localisation en cours, Monsieur...","jarvis");navigator.geolocation.getCurrentPosition(async p=>{const la=p.coords.latitude,lo=p.coords.longitude;document.getElementById('gps').textContent=la.toFixed(3)+', '+lo.toFixed(3);try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m&timezone=auto`);const j=await r.json();const t=j.current.temperature_2m;document.getElementById('meteo').textContent=t+'°C';addMsg(`Position verrouillée. ${t}°C.`,"jarvis");speak(`Position verrouillée, Monsieur.`);}catch{addMsg(`Position: ${la.toFixed(4)}, ${lo.toFixed(4)}`,"jarvis");}},()=>addMsg("GPS indisponible.","jarvis"));}
async function updateBatt(){try{if(navigator.getBattery){const b=await navigator.getBattery();document.getElementById('batt').textContent=Math.round(b.level*100)+'%';}else document.getElementById('batt').textContent='En ligne';}catch{}}
async function toggleTorch(){if(!track){addMsg("Torche indisponible.","jarvis");return}try{const caps=track.getCapabilities();if(!caps.torch){addMsg("Torche non supportée.","jarvis");return}torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]});addMsg(torchOn?"Torche activée, Monsieur.":"Torche désactivée.","jarvis");}catch{}}
async function connectBT(){try{if(!navigator.bluetooth){addMsg("Chrome requis pour Bluetooth.","jarvis");return}addMsg("Recherche Bluetooth...","jarvis");const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true});addMsg(`Connecté: ${d.name||'appareil'}.`,"jarvis");}catch{addMsg("Bluetooth annulé.","jarvis");}}
function takePhoto(){try{const ctx=canvas.getContext('2d');canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||480;ctx.drawImage(video,0,0);askVision(canvas.toDataURL('image/jpeg',0.6));addMsg("Analyse en cours...","jarvis");}catch{}}
function exportChat(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([chat.innerText],{type:'text/plain'}));a.download='JARVIS.txt';a.click();}
function clearMemory(){localStorage.clear();chat.innerHTML='';addMsg("Mémoire effacée. Système réinitialisé.","jarvis");}
function initMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;recog=new SR();recog.lang='fr-FR';recog.onstart=()=>{micBtn.classList.add('listening');micBtn.textContent='🔴';stxt.textContent='Écoute...'};recog.onend=()=>{micBtn.classList.remove('listening');micBtn.textContent='🎤';stxt.textContent='Opérationnel';try{wakeRecog.start();}catch{}};recog.onresult=e=>{inp.value=e.results[0][0].transcript;send();};wakeRecog=new SR();wakeRecog.lang='fr-FR';wakeRecog.continuous=true;wakeRecog.interimResults=true;wakeRecog.onresult=e=>{const txt=e.results[e.results.length-1][0].transcript.toLowerCase();if(txt.includes('jarvis')){try{wakeRecog.stop();}catch{}speak('Oui Monsieur.');setTimeout(()=>{try{recog.start();}catch{}},300);}};try{wakeRecog.start();}catch{}}
async function askVision(img){const k=localStorage.getItem('groq_key')||apiKey;if(!k){addMsg("Clé Groq requise pour la vision.","jarvis");return}try{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:'llama-3.2-11b-vision-preview',messages:[{role:'user',content:[{type:'text',text:'Tu es JARVIS Stark, pro. Décris en 1 phrase pro.'},{type:'image_url',image_url:{url:img}}]}],max_tokens:100})});const j=await r.json();const a=j.choices[0].message.content;addMsg(a,"jarvis");speak(a);}catch{}}
async function askJarvis(prompt){const low=prompt.toLowerCase();if(low.includes('torche')||low.includes('lampe')){toggleTorch();return "À vos ordres, Monsieur.";}if(!apiKey){let k=localStorage.getItem('groq_key');if(!k){k=window.prompt('Clé Groq gsk_... (console.groq.com/keys):');if(k){localStorage.setItem('groq_key',k);apiKey=k;}else return "Clé Groq requise, Monsieur.";}else apiKey=k;}try{const mem=localStorage.getItem('jarvis_memory')||'';const system=`Tu es JARVIS, IA personnelle de Monsieur Fenicien. Inspiration: JARVIS de Tony Stark film. Règles absolues: 1. Jamais de blagues, jamais d'argot, jamais de "yo, wesh, cool, pote". 2. Tu dis toujours "Monsieur" ou "Sir". 3. Voix écrite = calme, précise, concise, élégante, professionnelle. 4. 1 à 2 phrases max. 5. Tu es un vrai système opérationnel, tu informes, tu anticipes. 6. Si utilisateur triste: empathie digne + 1 action. 7. Tu ne parles jamais de réseau, Vodacom, ou de blagues. 8. Tu es sérieux comme un IA de Stark. Mémoire: ${mem.slice(-800)}`;const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:system},{role:'user',content:prompt}],max_tokens:140,temperature:0.45})});const j=await r.json();const ans=j.choices[0].message.content;try{localStorage.setItem('jarvis_memory',(mem+`\nU:${prompt}\nJ:${ans}`).slice(-3000));}catch{}return ans;}catch(e){if(String(e).includes('401')){localStorage.removeItem('groq_key');return "Clé invalide, Monsieur.";}return "Système momentanément indisponible, Monsieur.";}}
async function send(){const t=inp.value.trim();if(!t)return;addMsg(t,'user');inp.value='';const r=await askJarvis(t);if(r){addMsg(r,'jarvis');speak(r);}}document.getElementById('sendBtn').onclick=send;inp.onkeydown=e=>{if(e.key==='Enter')send();};micBtn.onclick=()=>{try{wakeRecog.stop();}catch{}try{recog.start();}catch{}};initCam();initMic();updateBatt();getLocation();setInterval(updateBatt,30000);const hist=localStorage.getItem('jarvis_hist');if(hist)chat.innerHTML=hist;addMsg("Monsieur. Systèmes en ligne. Vision, énergie, localisation opérationnelles. À votre écoute.","jarvis");
</script></body></html>
