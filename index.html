<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RK_JARVIS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060c1a;color:#c8d8f0;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0c1833;border-bottom:1px solid #1b335c}
h1{font-size:15px;color:#4ea8ff}
.dot{width:9px;height:9px;border-radius:50%;background:#00ff88;box-shadow:0 0 8px #00ff88}
.chips{display:flex;gap:6px;padding:8px 10px;flex-wrap:wrap;background:#0a142a}
.chip{background:#112240;border:1px solid #1e3a5f;border-radius:999px;padding:5px 12px;font-size:11px;color:#7fb8ff}
#videoWrap{position:relative;height:32vh;background:#000;overflow:hidden}
#videoWrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#ov{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:11px;color:#7fb8ff}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#070e20}
.msg{max-width:85%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.4;white-space:pre-wrap}
.msg.jarvis{align-self:flex-start;background:#13264a;border:1px solid #25406e}
.msg.user{align-self:flex-end;background:#1d5cb3;color:#fff;border-radius:16px 16px 4px 16px}
.ctrl{display:flex;gap:6px;padding:8px 10px;background:#0c1833}
.cbtn{background:#112240;border:1px solid #21406c;color:#8ab4ff;border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer}
.bar{display:flex;gap:8px;padding:10px;background:#0c1833;border-top:1px solid #1b335c;align-items:center}
.bar input{flex:1;background:#112240;border:1px solid #22426e;border-radius:24px;padding:12px 16px;color:#fff;outline:none}
.bar button{width:44px;height:44px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer}
#micBtn{background:#112240;border:1px solid #22426e}
#sendBtn{background:#1e5cb8;color:#fff;font-size:18px}
</style>
</head>
<body>
<header><h1>RK_JARVIS SYSTEM</h1><div style="display:flex;align-items:center;gap:8px"><div class="dot"></div><span style="font-size:12px">Intelligent Actif</span></div></header>
<div class="chips"><div class="chip" id="batt">--%</div><div class="chip" id="gps">GPS --</div><div class="chip" id="met">IA Groq Connectée</div></div>
<div id="videoWrap"><video id="video" autoplay playsinline muted></video><div id="ov">VISION ACTIVE</div></div>
<div id="chat"></div>
<div class="ctrl"><button class="cbtn" onclick="getLocation()">📍 Localiser</button><button class="cbtn" onclick="toggleTorch()">💡 Torche</button><button class="cbtn" onclick="clearAll()">🧠 Reset</button></div>
<div class="bar"><input id="inp" placeholder="Parlez à JARVIS..."><button id="micBtn">🎤</button><button id="sendBtn">➤</button></div>
<script>
const API_KEY = "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";
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
const video = document.getElementById('video');
let track = null, torchOn = false;
let voix = null;
const synth = window.speechSynthesis;
function loadV(){let vs=synth.getVoices();voix=vs.find(v=>v.lang.includes('fr'))||vs[0];}
synth.onvoiceschanged=loadV; loadV();
function addMsg(t,who){
  const d=document.createElement('div');
  d.className='msg '+who;
  d.textContent=t;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}
function speak(t){
  try{synth.cancel();let u=new SpeechSynthesisUtterance(t);u.voice=voix;u.lang='fr-FR';u.rate=0.85;u.pitch=0.55;synth.speak(u);}catch{}
}
async function initCam(){
  try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});video.srcObject=s;track=s.getVideoTracks()[0];}catch{}
}
function getLocation(){
  addMsg('Triangulation en cours Monsieur...','jarvis');
  navigator.geolocation.getCurrentPosition(p=>{
    const la=p.coords.latitude.toFixed(4),lo=p.coords.longitude.toFixed(4);
    document.getElementById('gps').textContent=la+','+lo;
    addMsg('Position verrouillée: '+la+', '+lo+' Secteur Goma nominal Monsieur.','jarvis');
    speak('Position verrouillée');
  },()=>addMsg('GPS faible Monsieur','jarvis'));
}
async function toggleTorch(){
  if(!track){addMsg('Torche indisponible Monsieur','jarvis');return;}
  try{
    const c=track.getCapabilities();
    if(!c.torch){addMsg('Torche non supportée','jarvis');return;}
    torchOn=!torchOn;
    await track.applyConstraints({advanced:[{torch:torchOn}]});
    addMsg(torchOn?'Torche activée Monsieur':'Torche désactivée Monsieur','jarvis');
  }catch{}
}
function clearAll(){chat.innerHTML='';addMsg('Mémoire effacée Monsieur','jarvis');}

async function askJarvis(prompt){
  addMsg('Analyse en cours Monsieur...','jarvis');
  try{
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
      body:JSON.stringify({
        model:'llama-3.3-70b-versatile',
        messages:[
          {role:'system',content:'Tu es RK JARVIS, assistant personnel sérieux, respectueux, tu appelles toujours l utilisateur Monsieur. Tu réponds toujours en français, de manière concise, grave, efficace, style Jarvis de Stark. Tu ne répètes jamais la question de l utilisateur. Tu donnes des réponses utiles, pratiques, intelligentes.'},
          {role:'user',content:prompt}
        ],
        temperature:0.7,
        max_tokens:700
      })
    });
    const data = await res.json();
    if(data.error){
      chat.lastChild.remove();
      addMsg('Erreur Groq Monsieur: '+data.error.message,'jarvis');
      return;
    }
    const txt = data.choices[0].message.content;
    chat.lastChild.remove();
    addMsg(txt,'jarvis');
    speak(txt);
  }catch(e){
    chat.lastChild?.remove();
    addMsg('Erreur connexion Monsieur: Vérifie internet. '+e.message,'jarvis');
  }
}

async function send(){
  const t=inp.value.trim();
  if(!t)return;
  addMsg(t,'user');
  inp.value='';
  await askJarvis(t);
}
document.getElementById('sendBtn').onclick=send;
inp.onkeydown=e=>{if(e.key==='Enter')send();};
document.getElementById('micBtn').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){addMsg('Micro non supporté Monsieur','jarvis');return;}
  const recog=new SR();recog.lang='fr-FR';
  recog.onresult=e=>{inp.value=e.results[0][0].transcript;send();};
  recog.start();
};
initCam();
addMsg('Monsieur. Système intelligent opérationnel. Posez votre question, je réponds comme ChatGPT maintenant.','jarvis');
if(navigator.getBattery){navigator.getBattery().then(b=>{document.getElementById('batt').textContent=Math.round(b.level*100)+'%';});}
</script>
</body>
  </html>
