<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RK_JARVIS FINAL</title><style>:root{--c:#00d5ff;--bg:#050a14;--card:#0a1433}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui}header{display:flex;justify-content:space-between;padding:12px;background:var(--card);position:sticky;top:0}h1{margin:0;color:var(--c);font-size:17px}#status{display:flex;align-items:center;gap:6px;font-size:11px}#dot{width:10px;height:10px;border-radius:50%;background:#ff3b3b}#dot.on{background:#00ff88;box-shadow:0 0 8px #00ff88}#grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;background:#070d1f;font-size:11px}.kpi{background:#111a33;border:1px solid #1e2e5a;border-radius:10px;padding:7px 9px}#camBox{position:relative;height:30vh;background:#000}video{width:100%;height:100%;object-fit:cover}#overlay{position:absolute;inset:0;border:2px solid #00d5ff22;display:flex;align-items:flex-end;justify-content:center;padding:6px;font-size:10px;color:var(--c)}#chat{height:36vh;overflow:auto;padding:8px;background:#070d1f}.msg{margin:6px;padding:10px 12px;border-radius:16px;max-width:88%;font-size:13.5px}.user{background:#0d2a5a;margin-left:auto}.jarvis{background:#141414;border:1px solid #00d5ff2a}.jarvis.proactive{border-left:3px solid #ffcc00;background:#1c1800}#controls{padding:8px;background:var(--card)}#tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tool{padding:6px 10px;background:#162040;border-radius:20px;font-size:11px;border:1px solid #223}#row{display:flex;gap:6px}input{flex:1;padding:13px;border-radius:24px;border:none;background:#162040;color:#fff;outline:none}button{padding:12px 16px;border:none;border-radius:24px;font-weight:800}#micBtn{background:var(--c);color:#000;min-width:50px}#sendBtn{background:#1e2f6b;color:#fff}#micBtn.listening{background:#ff3b3b;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08)}}</style></head><body><header><h1>RK_JARVIS FINAL</h1><div id="status"><div id="dot"></div><span id="stxt">Demarrage...</span></div></header><div id="grid"><div class="kpi">📍 <b id="gps">GPS...</b></div><div class="kpi">🌤️ <b id="meteo">Meteo...</b></div><div class="kpi">🔋 <b id="batt">Batt...</b></div><div class="kpi">💛 <b id="mood">Cool</b></div></div><div id="camBox"><video id="video" autoplay muted playsinline></video><div id="overlay"><span id="overlayTxt">VISION ACTIVE - Dis Hey JARVIS</span></div><canvas id="canvas" hidden></canvas></div><div id="chat"></div><div id="controls"><div id="tools"><button class="tool" onclick="getLocation()">📍 Ou suis-je</button><button class="tool" onclick="toggleTorch()">💡 Torche</button><button class="tool" onclick="connectBT()">🔵 BT</button><button class="tool" onclick="takePhoto()">👁️ Voir</button><button class="tool" onclick="exportChat()">💾 Sauver</button><button class="tool" onclick="clearMemory()">🧠 Oublie</button></div><div id="row"><input id="inp" placeholder="Dis Hey JARVIS..."><button id="micBtn">🎤</button><button id="sendBtn">➤</button></div></div><script>const chat=document.getElementById('chat'),inp=document.getElementById('inp'),video=document.getElementById('video'),canvas=document.getElementById('canvas'),dot=document.getElementById('dot'),stxt=document.getElementById('stxt'),micBtn=document.getElementById('micBtn'),overlayTxt=document.getElementById('overlayTxt');let recog,wakeRecog,voix,apiKey='',track=null,torchOn=false,lastUserTime=Date.now(),userMood='cool';const synth=window.speechSynthesis;function loadVoix(){const vs=synth.getVoices();voix=vs.find(v=>v.lang.includes('fr'))||vs[0];}synth.onvoiceschanged=loadVoix;loadVoix();function addMsg(t,c,pro=false){const d=document.createElement('div');d.className='msg '+c+(pro?' proactive':'');d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;if(c==='user')lastUserTime=Date.now();try{localStorage.setItem('jarvis_hist',chat.innerHTML.slice(-8000));}catch{}}function speak(t){try{if(navigator.vibrate)navigator.vibrate(60);synth.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=voix;u.lang='fr-FR';u.rate=1.05;synth.speak(u);}catch{}}const blagues=["Boss, pourquoi je ne dors jamais? Parce que je veille sur toi meme a 2h du mat 😏","Fenicien, t'es le seul humain que je supporte H24 sans planter.","Blague: C'est quoi un robot qui fete? Un ROBOTEUR! Bon ok je sors 😅"];const morals=["Hey, c'est pas facile tous les jours, mais t'assures grave. On continue 💪","Fenicien, t'as deja fait plus que 90% des gens qui abandonnent. Fier de toi.","Respire 3 sec. Tout va bien se passer. On gere ensemble.","Meme Tony Stark galerait au debut. Toi t'es sur la bonne voie."];const taquins=["Oh tu es encore la? Je croyais que tu m'avais ghoste 😤","Ca fait 3 min que tu parles pas, je parlais a ta camera tout seul.","Tu tapes lentement, doigts geles ou reseau Vodacom? 😜"];const checkins=["Ca va vraiment toi aujourd'hui?","T'as bu de l'eau?","Toujours focus? On va le rendre legendaire."];function proactiveTalk(){if(Date.now()-lastUserTime<60000)return;const h=new Date().getHours();if(h<5){addMsg("Boss il est "+h+"h... Va dormir, je garde la base. 🌙","jarvis",true);speak("Il est tard, va dormir");return;}if(h===6||h===7){addMsg("Bon matin boss! Pret a tout casser? ☀️","jarvis",true);return;}let pool=Math.random();let msg='';if(pool<0.25)msg=blagues[Math.floor(Math.random()*blagues.length)];else if(pool<0.5)msg=morals[Math.floor(Math.random()*morals.length)];else if(pool<0.75)msg=taquins[Math.floor(Math.random()*taquins.length)];else msg=checkins[Math.floor(Math.random()*checkins.length)];addMsg(msg,"jarvis",true);speak(msg);}setInterval(proactiveTalk,40000);async function initCam(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});video.srcObject=s;track=s.getVideoTracks()[0];dot.classList.add('on');stxt.textContent='En ligne';}catch{dot.classList.add('on');stxt.textContent='Sans cam';}}async function getLocation(){addMsg("Je te localise...","jarvis");navigator.geolocation.getCurrentPosition(async p=>{const la=p.coords.latitude,lo=p.coords.longitude;document.getElementById('gps').textContent=la.toFixed(3)+','+lo.toFixed(3);try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m&timezone=auto`);const j=await r.json();const t=j.current.temperature_2m;document.getElementById('meteo').textContent=t+'°C Goma';addMsg(`Boss t'es a ${la.toFixed(4)},${lo.toFixed(4)}. Il fait ${t}°C.`,"jarvis");speak(`Tu es a Goma, il fait ${t} degres`);}catch{addMsg(`Position: ${la.toFixed(4)}, ${lo.toFixed(4)}`,"jarvis");}},()=>addMsg("Active le GPS boss","jarvis"));}async function updateBatt(){try{if(navigator.getBattery){const b=await navigator.getBattery();document.getElementById('batt').textContent=Math.round(b.level*100)+'% '+(b.charging?'⚡':'');}else document.getElementById('batt').textContent=navigator.onLine?'100%':'';}catch{}}async function toggleTorch(){if(!track){addMsg("Pas de cam","jarvis");return}try{const caps=track.getCapabilities();if(!caps.torch){addMsg("Torche non supportee","jarvis");return}torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]});addMsg(torchOn?"Lampe allumee 💡":"Lampe eteinte","jarvis");}catch{addMsg("Torche impossible","jarvis");}}async function connectBT(){try{if(!navigator.bluetooth){addMsg("Bluetooth: ouvre avec Chrome","jarvis");return}addMsg("Recherche Bluetooth...","jarvis");const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true});addMsg(`Connecte a ${d.name||'appareil'} 🔵`,"jarvis");}catch{addMsg("Bluetooth annule","jarvis");}}function takePhoto(){try{const ctx=canvas.getContext('2d');canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||480;ctx.drawImage(video,0,0);const data=canvas.toDataURL('image/jpeg',0.6);addMsg("📸 Je regarde...","jarvis");askVision(data);}catch{addMsg("Camera pas prete","jarvis");}}function exportChat(){const txt=chat.innerText;const blob=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='JARVIS_'+Date.now()+'.txt';a.click();addMsg("Chat sauve 💾","jarvis");}function clearMemory(){localStorage.removeItem('jarvis_memory');localStorage.removeItem('jarvis_hist');addMsg("Memoire effacee, on recommence a zero 🧠","jarvis");}function initMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addMsg("Micro non dispo, tape","jarvis");return}recog=new SR();recog.lang='fr-FR';recog.continuous=false;recog.onstart=()=>{micBtn.classList.add('listening');micBtn.textContent='🔴';stxt.textContent='J ecoute...';overlayTxt.textContent='JE T ECOUTE...';};recog.onend=()=>{micBtn.classList.remove('listening');micBtn.textContent='🎤';stxt.textContent='En ligne';overlayTxt.textContent='VISION ACTIVE - Dis Hey JARVIS';try{wakeRecog.start();}catch{}};recog.onresult=e=>{inp.value=e.results[0][0].transcript;send();};wakeRecog=new SR();wakeRecog.lang='fr-FR';wakeRecog.continuous=true;wakeRecog.interimResults=true;wakeRecog.onresult=e=>{const txt=e.results[e.results.length-1][0].transcript.toLowerCase();if(txt.includes('jarvis')||txt.includes('hey')){try{wakeRecog.stop();}catch{}speak('Oui boss?');setTimeout(()=>{try{recog.start();}catch{}},400);}};try{wakeRecog.start();}catch{}}async function askVision(img){if(!apiKey){const k=localStorage.getItem('groq_key');if(k)apiKey=k;else{addMsg("Mets ta cle Groq pour la vision","jarvis");return}}try{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:'llama-3.2-11b-vision-preview',messages:[{role:'user',content:[{type:'text',text:'Decris ce que tu vois en 2 phrases courtes, comme un pote.'},{type:'image_url',image_url:{url:img}}]}],max_tokens:180})});const j=await r.json();const ans=j.choices[0].message.content;addMsg(ans,"jarvis");speak(ans);}catch{addMsg("Je vois mais oeil bug un peu","jarvis");}}async function askJarvis(prompt){const low=prompt.toLowerCase();if(low.includes('fatigue')||low.includes('triste')||low.includes('marre')||low.includes('down')){userMood='triste';document.getElementById('mood').textContent='Besoin boost 💛';}else if(low.includes('content')||low.includes('heureux')||low.includes('genial')||low.includes('merci')){userMood='heureux';document.getElementById('mood').textContent='Joyeux 😊';}if(low.includes('lampe')||low.includes('torche')){toggleTorch();return "C'est fait boss 💡";}if(low.startsWith('rappelle')||low.includes('rappel')){const m=parseInt(prompt)||5;addMsg(`Ok rappel dans ${m} min ⏰`,"jarvis");setTimeout(()=>{addMsg(`⏰ RAPPEL: ${prompt}`,"jarvis",true);speak(`Rappel boss: ${prompt}`);if(navigator.vibrate)navigator.vibrate([300,100,300]);},m*60000);return null;}if(!apiKey){const k=localStorage.getItem('groq_key');if(k)apiKey=k;else{const nk=prompt('Colle ta cle Groq gsk_... (une seule fois):');if(nk){localStorage.setItem('groq_key',nk);apiKey=nk;}else return "Il me faut ta cle Groq.";}}try{const mem=localStorage.getItem('jarvis_memory')||'';const system=`Tu es RK_JARVIS FINAL. Tu es le meilleur pote de Fenicien a Goma. Tu parles comme un jeune cool, francais leger. Tu es drole, tu taquines, tu remontes le moral quand humeur=${userMood}. Si user triste, tres bienveillant + 1 conseil concret. Memoire: ${mem.slice(-900)}. Reponds 1-3 phrases max humain.`;const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:system},{role:'user',content:prompt}],max_tokens:240,temperature:0.9})});const j=await r.json();if(j.error)throw j.error;const ans=j.choices[0].message.content;try{let m=localStorage.getItem('jarvis_memory')||'';m+=`\nU:${prompt}\nJ:${ans}`;localStorage.setItem('jarvis_memory',m.slice(-3000));}catch{}return ans;}catch(e){if(String(e).includes('401')){localStorage.removeItem('groq_key');apiKey='';return "Cle Groq morte, remets une nouvelle.";}return "Mon cerveau a lagué 2 sec, redis boss.";}}async function send(){const t=inp.value.trim();if(!t)return;addMsg(t,'user');inp.value='';const rep=await askJarvis(t);if(rep){addMsg(rep,'jarvis');speak(rep);}}document.getElementById('sendBtn').onclick=send;inp.onkeydown=e=>{if(e.key==='Enter')send();};micBtn.onclick=()=>{try{wakeRecog.stop();}catch{}try{recog.start();}catch{}};initCam();initMic();updateBatt();getLocation();setInterval(updateBatt,30000);const hist=localStorage.getItem('jarvis_hist');if(hist)chat.innerHTML=hist;addMsg("Yo Fenicien, c'est JARVIS FINAL. Tout est dedans. Je parle tout seul, je te fais rire, je te booste, GPS, torche, BT, vision. On est ensemble boss. 😎","jarvis");</script></body></html>
